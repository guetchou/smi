server {
    listen 80;
    server_name caisse.topcenter.cg;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name caisse.topcenter.cg;

    # SSL (Let's Encrypt / certbot)
    # ssl_certificate /etc/letsencrypt/live/caisse.topcenter.cg/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/caisse.topcenter.cg/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        proxy_pass http://caisse:3337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }
}
