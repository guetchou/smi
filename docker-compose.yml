version: '3.8'

# =============================================================================
# ⛔ DANGER — DONNÉES DE PRODUCTION
# =============================================================================
# Le volume "caisse_data" contient les UPLOADS.
# Le volume "mysql_data" contient la BASE DE DONNÉES MySQL.
#
# COMMANDES INTERDITES (détruisent toutes les données) :
#   ❌  docker compose down -v
#   ❌  docker compose down --volumes
#   ❌  docker volume rm caisse-topcenter_mysql_data
#   ❌  docker volume rm caisse-topcenter_caisse_data
#   ❌  docker volume prune
#
# COMMANDES AUTORISÉES :
#   ✅  docker compose up -d --build     (rebuild sans toucher aux données)
#   ✅  docker compose down              (arrêt sans -v)
#   ✅  docker compose restart
#
# Lire DANGER.md avant toute intervention.
# =============================================================================

services:
  caisse:
    build: .
    container_name: caisse-topcenter
    restart: unless-stopped
    ports:
      - "3337:3337"
    volumes:
      - caisse_data:/app/backend/data
    environment:
      - NODE_ENV=production
      - PORT=3337
      - JWT_SECRET=${JWT_SECRET:-topcenter-caisse-jwt-secret-change-in-prod-2025}
      # Production Docker = MySQL. SQLite est interdit hors migration explicite.
      - DB_DRIVER=${DB_DRIVER:-mysql}
      # Chemin historique SQLite : lecture migration uniquement, pas runtime prod.
      - DB_PATH=/app/backend/data/caisse.db
      # MySQL — actif quand DB_DRIVER=mysql
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-caisse_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-caisse_topcenter}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3337/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - caisse_net

  mysql:
    image: mysql:8.0
    container_name: caisse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-caisse_topcenter}
      MYSQL_USER: ${MYSQL_USER:-caisse_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    # Port exposé uniquement en local — 3307 car 3306 est pris par fmc-talents-mysql sur ce VPS
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucaisse_user", "-p${MYSQL_PASSWORD}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - caisse_net

volumes:
  caisse_data:
    driver: local
  mysql_data:
    driver: local

networks:
  caisse_net:
    driver: bridge
