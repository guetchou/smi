name: Deploy to VPS-OVH

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA already present on main
        required: true
        type: string
      confirm:
        description: Explicit production deployment confirmation
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - DEPLOY

permissions:
  contents: read

concurrency:
  group: smi-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DEPLOY_SHA: ${{ inputs.sha }}
      VPS_HOST: 5.196.22.149
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root

    steps:
      - name: Validate requested SHA
        run: |
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full lowercase 40-character commit SHA is required" >&2
            exit 1
          fi

      - name: Checkout main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify commit belongs to main
        run: |
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          git checkout --detach "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Cache node_modules
        # « cache: npm » ci-dessus ne garde que ~/.npm ; « npm ci » efface
        # node_modules a chaque fois. C'est ce cache-ci qui evite les ~78 s.
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'backend/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --prefix backend
          npm ci

      - name: Validate repository
        run: npm test

      - name: Install PDF runtime
        if: ${{ hashFiles('scripts/test_employment_contracts_isolated.js') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends wkhtmltopdf
          wkhtmltopdf --version

      - name: Cache navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Validate salary and contract workflow
        if: ${{ hashFiles('scripts/test_employment_contracts_isolated.js') != '' }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:employment-contracts:e2e

      - name: Validate cash entry workflow
        if: ${{ hashFiles('scripts/test_caisse_operation_isolated.js') != '' }}
        run: npm run test:caisse:e2e
      - name: Validate role journeys
        if: ${{ hashFiles('scripts/test_parcours_roles_isolated.js') != '' }}
        run: npm run test:roles:e2e
      - name: Validate alert visibility and cancellation
        if: ${{ hashFiles('scripts/test_alertes_destinataire_isolated.js') != '' }}
        run: npm run test:alertes:e2e
      - name: Validate cashbox scope
        if: ${{ hashFiles('scripts/test_perimetre_caisse_isolated.js') != '' }}
        run: npm run test:perimetre:e2e
      - name: Validate reconciliation balance
        if: ${{ hashFiles('scripts/test_rapprochement_virement_isolated.js') != '' }}
        run: npm run test:rapprochement:e2e
      - name: Validate closure lock
        if: ${{ hashFiles('scripts/test_cloture_verrou_isolated.js') != '' }}
        run: npm run test:cloture:e2e
      - name: Validate approval thresholds
        if: ${{ hashFiles('scripts/test_seuils_approbation_isolated.js') != '' }}
        run: npm run test:seuils:e2e
      - name: Validate production image PDF runtime
        run: |
          docker build --tag smi-release-candidate .
          docker run --rm --entrypoint wkhtmltopdf smi-release-candidate --version

      - name: Configure pinned SSH host
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '5.196.22.149 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILgF5hnIBFqyMIyplf931OI4EdXqJDl1314PveDfKyTJ' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy audited commit to VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              "root@$VPS_HOST" \
              "cd /opt/projet-smi && if [ -n \"\$(git status --porcelain --untracked-files=all)\" ]; then echo 'Refus déploiement : worktree VPS non propre' >&2; git status --short >&2; exit 1; fi && git fetch origin main && git cat-file -e '${DEPLOY_SHA}^{commit}' && git merge-base --is-ancestor '$DEPLOY_SHA' origin/main && git checkout -B main '$DEPLOY_SHA' && DEPLOY_BRANCH=main DEPLOY_SHA='$DEPLOY_SHA' bash scripts/deploy.sh"

      - name: Record successful release
        if: success()
        run: |
          echo "Production deployment completed"
          echo "Commit: $DEPLOY_SHA"
          echo "Actor: ${{ github.actor }}"

      - name: Record failed release
        if: failure()
        run: echo "Production deployment failed; inspect this workflow run"
