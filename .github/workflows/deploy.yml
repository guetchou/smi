name: Deploy to VPS-OVH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate repository
        run: npm test

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 5.196.22.149 >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "5.196.22.149 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILgF5hnIBFqyMIyplf931OI4EdXqJDl1314PveDfKyTJ" >> ~/.ssh/known_hosts

      - name: Deploy to VPS via SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              root@5.196.22.149 \
              "cd /opt/projet-smi && git fetch origin main && git checkout -B main origin/main && export DEPLOY_BRANCH=main && bash scripts/deploy.sh"

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Déploiement réussi sur VPS-OVH (5.196.22.149)"
          echo "Commit: ${{ github.sha }}"
          echo "Auteur: ${{ github.actor }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Échec du déploiement — vérifier les logs GitHub Actions"
