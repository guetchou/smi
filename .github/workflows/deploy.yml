name: SMI - CI/CD Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA complet de main à déployer"
        required: true
        type: string
      confirmation:
        description: "Saisir DEPLOY"
        required: true
        type: string

concurrency:
  group: smi-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality_gate:
    if: inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Validate requested SHA
        id: target
        run: |
          set -euo pipefail
          SHA="${{ inputs.sha }}"
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin main --prune
          git cat-file -e "${SHA}^{commit}"
          git merge-base --is-ancestor "$SHA" origin/main
          git checkout --detach "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci
      - name: Tests
        run: npm test
      - name: Validate deployment script
        run: bash -n scripts/deploy.sh

  deploy:
    needs: [quality_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_SHA: ${{ needs.quality_gate.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.quality_gate.outputs.sha }}
      - name: Validate deployment identity
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_USER"
          test -n "$VPS_HOST"
          test -n "$KNOWN_HOSTS"
          test "$VPS_USER" != "root"
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Trust production host
        env:
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy exact SHA
        run: |
          ssh -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            DEPLOY_SHA="$DEPLOY_SHA" \
            'bash -s' < scripts/deploy.sh
      - name: Verify SHA and health
        run: |
          ACTUAL=$(ssh -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/projet-smi && git rev-parse HEAD")
          test "$ACTUAL" = "$DEPLOY_SHA"
          ssh -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "curl -fsS --max-time 10 http://127.0.0.1:3337/api/health >/dev/null"
