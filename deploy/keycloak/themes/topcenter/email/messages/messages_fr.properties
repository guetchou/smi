# Messages electroniques de Tala SMI.
# Le nom de l'entreprise remplace « Keycloak » partout : un agent qui recoit
# ces messages n'a pas a connaitre le nom du logiciel d'authentification.

emailVerificationSubject=Confirmez votre adresse
emailVerificationBody=Bonjour,\n\nUn compte vient d''etre ouvert a votre nom sur Tala SMI. Confirmez votre adresse en suivant ce lien :\n\n{0}\n\nCe lien est valable {2} minutes.\n\nSi vous n''etes pas a l''origine de cette demande, ignorez ce message.\n\nTOP CENTER
emailVerificationBodyHtml=<p>Bonjour,</p><p>Un compte vient d''etre ouvert a votre nom sur <b>Tala SMI</b>. Confirmez votre adresse en suivant ce lien :</p><p><a href="{0}">Confirmer mon adresse</a></p><p>Ce lien est valable {2} minutes.</p><p>Si vous n''etes pas a l''origine de cette demande, ignorez ce message.</p><p>TOP CENTER</p>

passwordResetSubject=Reinitialisation de votre mot de passe
passwordResetBody=Bonjour,\n\nUne reinitialisation de mot de passe a ete demandee pour votre compte Tala SMI. Definissez votre nouveau mot de passe en suivant ce lien :\n\n{0}\n\nCe lien est valable {2} minutes.\n\nSi vous n''etes pas a l''origine de cette demande, ignorez ce message : votre mot de passe actuel reste valable.\n\nTOP CENTER
passwordResetBodyHtml=<p>Bonjour,</p><p>Une reinitialisation de mot de passe a ete demandee pour votre compte <b>Tala SMI</b>.</p><p><a href="{0}">Definir mon nouveau mot de passe</a></p><p>Ce lien est valable {2} minutes.</p><p>Si vous n''etes pas a l''origine de cette demande, ignorez ce message : votre mot de passe actuel reste valable.</p><p>TOP CENTER</p>

executeActionsSubject=Action requise sur votre compte
executeActionsBody=Bonjour,\n\nUne action est requise sur votre compte Tala SMI. Suivez ce lien pour la realiser :\n\n{0}\n\nCe lien est valable {2} minutes.\n\nSi vous n''etes pas a l''origine de cette demande, ignorez ce message.\n\nTOP CENTER
executeActionsBodyHtml=<p>Bonjour,</p><p>Une action est requise sur votre compte <b>Tala SMI</b>.</p><p><a href="{0}">Realiser cette action</a></p><p>Ce lien est valable {2} minutes.</p><p>Si vous n''etes pas a l''origine de cette demande, ignorez ce message.</p><p>TOP CENTER</p>

eventLoginErrorSubject=Tentative de connexion refusee
eventLoginErrorBody=Une tentative de connexion a votre compte Tala SMI a echoue le {0} depuis {1}. Si ce n''etait pas vous, prevenez votre administrateur.
