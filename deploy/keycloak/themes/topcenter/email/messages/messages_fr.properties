eventUpdatePasswordSubject=Votre mot de passe a ete modifie
eventUpdatePasswordBody=Le mot de passe de votre compte Tala SMI a ete modifie le {0} depuis {1}. Si ce n''etait pas vous, prevenez immediatement votre administrateur.
